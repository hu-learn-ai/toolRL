name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest + eval smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[env,dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Eval smoke (mock, no GPU)
        run: python -m eval --mock --size 20 --seed 42 --out eval_out/ci_smoke.md

  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
